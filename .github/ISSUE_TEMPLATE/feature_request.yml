---
name: Feature request
description: Propose a real, testable capability
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem and proposed behavior
    validations:
      required: true
  - type: textarea
    id: tests
    attributes:
      label: How would we test it (including failure cases)?
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy checklist
      options:
        - label: No telemetry or external calls required
        - label: No raw message text in logs or reports
