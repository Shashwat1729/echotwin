# EchoTwin default SFT/LoRA training configuration.
# Usage: echotwin train lora --config configs/training.yaml
# Research-backed defaults (2026 consensus for small-data style transfer):
# - LoRA r=16 on all projection modules; lr=1e-4; early stopping ON.
# - QLoRA (method: qlora) requires a CUDA GPU + bitsandbytes; it fails
#   loudly instead of silently substituting another method.

model: qwen3-4b-it-2507
method: lora # full | lora | qlora
output_dir: artifacts/experiments
epochs: 3.0
learning_rate: 0.0001
lora:
  r: 16
  alpha: 32
  dropout: 0.05
  target_modules:
    - .*q_proj
    - .*k_proj
    - .*v_proj
    - .*o_proj
    - .*gate_proj
    - .*up_proj
    - .*down_proj
  bias: none
batch_size: 1
gradient_accumulation_steps: 8
seq_len: 1024
train_on_last_only: true
warmup_ratio: 0.05
max_grad_norm: 1.0
lr_scheduler: cosine
weight_decay: 0.0
logging_steps: 5
eval_steps: null
save_steps: null
save_total_limit: 2
seed: 20250917
gradient_checkpointing: false
early_stopping_patience: 3
resume_from_checkpoint: null
fp16: false
bf16: false
report_to: none
run_name: null
