[project]
name = "echotwin"
version = "0.1.0"
description = "Local-first, privacy-preserving tool that learns a consenting person's writing style from their own WhatsApp history, fine-tunes and evaluates a small language model, and supports authorized Hindi-English voice cloning."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11,<3.13"
authors = [{ name = "EchoTwin contributors" }]
keywords = ["personalization", "whatsapp", "lora", "qlora", "voice-cloning", "privacy", "local-first"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Communications :: Chat",
]

dependencies = [
    "pydantic>=2.6,<3",
    "pydantic-settings>=2.2,<3",
    "PyYAML>=6.0,<7",
    "typer>=0.12,<1",
    "rich>=13,<15",
    "fastapi>=0.110,<1",
    "httpx>=0.27,<1",
    "uvicorn>=0.29,<1",
    "python-multipart>=0.0.9",
    "numpy>=1.26,<3",
    "regex>=2024.4.16",
    "packaging>=24",
]

[project.optional-dependencies]
# Audio ingestion/quality/coverage without heavyweight ML.
voice = [
    "soundfile>=0.12.1",
    "scipy>=1.11",
]
# Independent speaker-similarity evaluation for cloned audio.
# speechbrain/spkrec-ecapa-voxceleb is the only evaluator we measured to
# separate speakers reliably (see docs/voice-cloning.md).
voice-eval = [
    "speechbrain>=1.1",
    "torch>=2.2",
    "torchaudio>=2.1",
]
# Heavy language-model stack (SFT/LoRA/QLoRA/DPO).
train = [
    "torch>=2.2",
    "transformers>=4.46",
    "peft>=0.12",
    "datasets>=2.20",
    "accelerate>=0.31",
    "trl>=0.9",
]
# Gradio studio (browser recording + full UI).
ui = [
    "gradio>=4.44",
]
# Language identification (config-selectable; heuristic is the default).
lang = [
    "langdetect>=1.0.9",
]
dev = [
    "pytest>=8,<10",
    "pytest-cov>=5",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
]

[project.scripts]
# `main` (not `app`) so EchoTwinError exceptions are rendered as actionable
# messages with the documented exit codes instead of raw tracebacks.
echotwin = "echotwin.cli:main"

[project.urls]
Homepage = "https://github.com/Shashwat1729/echotwin"
Repository = "https://github.com/Shashwat1729/echotwin"
Documentation = "https://github.com/Shashwat1729/echotwin/tree/main/docs"
Issues = "https://github.com/Shashwat1729/echotwin/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/echotwin"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "integration: needs optional model/backend downloads (deselect with -m 'not integration')",
    "performance: lightweight timing checks",
]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF", "W"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
# Typer/FastAPI declare CLI/API schemas via defaults in signatures by design.
"src/echotwin/cli/*.py" = ["B008"]
"src/echotwin/api/*.py" = ["B008"]

[tool.coverage.run]
source = ["echotwin"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
warn_unused_ignores = false
